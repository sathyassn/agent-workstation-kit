# ---------------------------------------------------------------------------
# [security]
# ---------------------------------------------------------------------------

[[field]]
key = "security.disk_encryption_required"
type = "bool"
required = true
default = true
stage = "baseline"
what = "Require full-disk encryption (LUKS or FileVault) on the workstation."
why = "Protects code, caches and OS state at rest."
options = ["true: required safety-floor baseline"]
recommended = "true"
risk = "Cannot be disabled; disabling is refused by the safety floor."
undo = "Not weaken-able; must remain true."
requires = []
manual_equivalent = "Verify LUKS (lsblk/cryptsetup) or FileVault (fdesetup status)."

[[field]]
key = "security.secure_boot_required"
type = "bool"
required = true
default = true
stage = "baseline"
what = "Require verified boot security on the workstation."
why = "Protects kernel and bootloader integrity."
options = ["true: required safety-floor baseline"]
recommended = "true"
risk = "Cannot be disabled; disabling is refused by the safety floor."
undo = "Not weaken-able; must remain true."
requires = []
manual_equivalent = "mokutil --sb-state on Linux or Apple Silicon Full Security on macOS."

[[field]]
key = "security.remote_scope"
type = "enum"
enum = "RemoteScope"
required = true
default = "tailscale-only"
stage = "remote"
what = "Network boundary permitted for incoming remote administration."
why = "Keeps SSH and remote desktop reachable only over the mesh VPN."
options = ["tailscale-only: required safety-floor baseline"]
recommended = "tailscale-only"
risk = "Broadening remote scope is refused by the safety floor."
undo = "Not weaken-able; must remain tailscale-only."
requires = []
manual_equivalent = "Deny-by-default firewall allowing remote ports only on the tailnet interface."

[[field]]
key = "security.endpoint_management"
type = "enum"
enum = "EndpointManagement"
required = true
ready_required = true
default = "ask"
stage = "audit"
what = "Endpoint management and EDR enrolment posture for the host."
why = "Records required corporate MDM/EDR coverage for audits."
options = ["ask: unresolved draft", "mdm: MDM only", "edr: EDR only", "mdm-and-edr: both MDM and EDR", "not-required: personal or exempt host"]
recommended = "mdm-and-edr for work hosts; not-required for personal hosts"
risk = "Leaving ask blocks ready validation."
undo = "Update endpoint_management in the profile."
requires = []
manual_equivalent = "Verify MDM profile and EDR agent status."

# ---------------------------------------------------------------------------
# [resources]
# ---------------------------------------------------------------------------

[[field]]
key = "resources.policy"
type = "enum"
enum = "ResourcePolicy"
required = true
default = "measured-balanced"
stage = "resources"
what = "Resource-ceiling policy applied to agent workloads."
why = "Reserves memory and CPU headroom for the OS and desktop while capping agent work."
options = ["measured-balanced: reserve-based memory and CPU ceiling"]
recommended = "measured-balanced"
risk = "Unsupported policies fail validation."
undo = "Revert the resource-limits unit."
requires = []
manual_equivalent = "systemd user slice drop-ins for agent.slice and agent-work.slice."

[[field]]
key = "resources.os_cpu_reserve_threads"
type = "int"
required = true
default = 2
min = 1
max = 8
stage = "resources"
what = "Baseline OS CPU reserve threads recorded in Schema 3 profiles."
why = "Ensures the OS and desktop keep responsive CPU headroom."
options = ["integer from 1 through 8"]
recommended = "2"
risk = "Too few reserved threads can starve desktop and SSH responsiveness."
undo = "Revert resource-limits or restore the previous value."
requires = []
manual_equivalent = "Set CPUQuota in the agent-work slice drop-in."

[[field]]
key = "resources.os_memory_reserve_percent"
type = "int"
required = false
min = 5
max = 50
stage = "resources"
what = "Optional explicit OS memory reserve percentage override."
why = "Allows overriding the default reserve formula by percentage of RAM."
options = ["integer from 5 through 50; cannot be combined with reserve_fixed_gib"]
recommended = "Omit to use the default reserve formula"
risk = "Setting too small a reserve risks OOM thrashing; too large reduces agent headroom."
undo = "Remove os_memory_reserve_percent and re-apply resource-limits."
requires = []
manual_equivalent = "Pass --memory-reserve-percent to resource policy."

[[field]]
key = "resources.os_memory_reserve_gib"
type = "int"
required = false
deprecated = true
min = 4
max = 32
stage = "resources"
what = "Deprecated fixed GiB memory reserve kept for backwards compatibility."
why = "Accepted so existing Schema 3 profiles remain valid while migrating to reserve_fixed_gib."
options = ["integer from 4 through 32 (deprecated)"]
recommended = "Omit; use reserve_fixed_gib when an explicit GiB override is needed"
risk = "No longer applied by the resource policy script."
undo = "Remove os_memory_reserve_gib from the profile."
requires = []
manual_equivalent = "Replace with resources.reserve_fixed_gib if overriding the default."

[[field]]
key = "resources.reserve_fixed_gib"
type = "float"
required = false
stage = "resources"
what = "Optional fixed RAM reserve override in GiB (plus 2% of RAM)."
why = "Overrides the role default (8 GiB desktop or 2 GiB headless) when measured load differs."
options = ["positive finite number below 1000000; cannot be combined with os_memory_reserve_percent"]
recommended = "Omit to use 8 GiB desktop / 2 GiB headless default"
risk = "Setting a value below measured non-agent memory use risks host stalls."
undo = "Remove reserve_fixed_gib and re-apply resource-limits."
requires = []
manual_equivalent = "Pass --reserve-fixed-gib to resource policy."

[[field]]
key = "resources.reserve_cores"
type = "int"
required = false
min = 0
max = 1024
stage = "resources"
what = "Optional reserved CPU core count override for the OS and desktop."
why = "Overrides the default clamp(ceil(cores * 5%), 2, 4) core reserve."
options = ["integer from 0 through 1024"]
recommended = "Omit to use the automatic core-reserve formula"
risk = "Setting 0 removes dedicated CPU headroom for the OS and desktop."
undo = "Remove reserve_cores and re-apply resource-limits."
requires = []
manual_equivalent = "Pass --reserve-cores to resource policy."

[[field]]
key = "resources.cpu_weight"
type = "int"
required = false
default = 50
min = 1
max = 10000
stage = "resources"
what = "Optional systemd CPUWeight for agent.slice relative to desktop slices (100)."
why = "Keeps interactive desktop and SSH sessions responsive under heavy agent CPU load."
options = ["integer from 1 through 10000"]
recommended = "50"
risk = "Raising above 100 prioritises background agent work over interactive sessions."
undo = "Remove cpu_weight and re-apply resource-limits."
requires = []
manual_equivalent = "CPUWeight= in /etc/systemd/user/agent.slice.d/50-agent-workstation-kit.conf."

