name: Feature request
description: Propose a focused, portable improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the operational problem without prescribing a solution first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include platform scope, safety boundaries, and expected operator experience.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and rollback
      description: Explain how the change can be tested, repeated, and safely undone.
    validations:
      required: true
