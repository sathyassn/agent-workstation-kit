# public-scan: authoritative deterministic privacy and identity scan from the trusted base.
#
# Runs on `pull_request_target` (for pull requests targeting any branch) and
# pushes to `main`.
# - On `pull_request_target`, checks out the pull request's exact target base
#   commit (`github.event.pull_request.base.sha`, validated as an ancestor of
#   `refs/heads/<base.ref>`) so a PR targeting an older or non-default branch
#   cannot inherit exemptions that exist only on the default branch.
# - On `push` to `main`, checks out the previous trusted commit on `main`
#   (`github.event.before`) to supply the scanner, modes, exemptions, binary
#   exceptions, and identity helpers, and scans `before..github.sha` as git data
#   only (failing closed if `before` is zero on any non-root commit).
#
# No secret is required, so fork and same-repository pull requests run the exact
# same blocking checks on both Linux and macOS.
#
# Both platform jobs (`scan-linux` and `scan-macos`) emit positive verification
# outputs only when `tests/check_public_release.py` exits 0 and prints both
# `PUBLIC_SCAN_VERIFIED=1` and `PUBLIC_SCAN_IDENTITY_VERIFIED=1`. The required
# status check is `public-scan / result` (the exact job `name:` published to
# GitHub Checks), which always runs and fails closed unless BOTH Linux and macOS
# succeeded and emitted `scan_verified=true` and `identity_verified=true`.
name: public-scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  scan-linux:
    name: public scan (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scan_verified: ${{ steps.run_scan.outputs.verified }}
      identity_verified: ${{ steps.run_scan.outputs.identity_verified }}
    steps:
      - name: Check out the trusted base commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch commit range to scan as git data
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            checked_out=$(git rev-parse HEAD)
            if [ "$checked_out" != "$BASE_SHA" ]; then
              echo "::error::checked-out base commit does not match pull request base SHA"
              exit 1
            fi
            git fetch --no-tags "https://github.com/${REPOSITORY}.git" "+refs/heads/${BASE_REF}:refs/scan/base-branch"
            git merge-base --is-ancestor "$BASE_SHA" refs/scan/base-branch
            git fetch --no-tags "https://github.com/${REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/scan/head"
            fetched=$(git rev-parse refs/scan/head)
            if [ "$fetched" != "$HEAD_SHA" ]; then
              echo "::error::pull request head moved since this event; a newer run will scan it"
              exit 1
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            echo "mode=range" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              checked_out=$(git rev-parse HEAD)
              if [ "$checked_out" != "$PUSH_BEFORE" ]; then
                echo "::error::checked-out base commit does not match previous main commit"
                exit 1
              fi
              if ! git cat-file -e "${PUSH_HEAD}^{commit}" 2>/dev/null; then
                git fetch --no-tags "https://github.com/${REPOSITORY}.git" "$PUSH_HEAD"
              fi
              git cat-file -e "${PUSH_HEAD}^{commit}"
              echo "mode=range" >> "$GITHUB_OUTPUT"
              echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
              echo "head=$PUSH_HEAD" >> "$GITHUB_OUTPUT"
            else
              parents=$(git rev-list --parents -n 1 "$PUSH_HEAD")
              if [ "$(printf '%s\n' "$parents" | wc -w)" -gt 1 ]; then
                echo "::error::push event has zero before SHA on a non-root commit; refusing to trust head scanner"
                exit 1
              fi
              echo "mode=tree" >> "$GITHUB_OUTPUT"
              echo "head=$PUSH_HEAD" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run deterministic privacy and identity scan on every commit
        id: run_scan
        env:
          SCAN_MODE: ${{ steps.target.outputs.mode }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          supports_identity=false
          if python3 -I -B tests/check_public_release.py --help 2>&1 | grep -q -- '--identity-source'; then
            supports_identity=true
          fi
          set +e
          if [ "$supports_identity" = "true" ]; then
            if [ "$SCAN_MODE" = "range" ]; then
              out=$(python3 -I -B tests/check_public_release.py --range "$BASE_SHA" "$HEAD_SHA" --identity-source ci 2>&1)
              status=$?
            elif [ "$SCAN_MODE" = "tree" ]; then
              out=$(python3 -I -B tests/check_public_release.py --tree "$HEAD_SHA" --identity-source ci 2>&1)
              status=$?
            else
              echo "::error::unexpected scan mode"
              exit 1
            fi
          else
            echo "::notice::One-time bootstrap: trusted base scanner predates --identity-source; running base privacy scan without identity verification"
            if [ "$SCAN_MODE" = "range" ]; then
              out=$(python3 -I -B tests/check_public_release.py --range "$BASE_SHA" "$HEAD_SHA" 2>&1)
              status=$?
            elif [ "$SCAN_MODE" = "tree" ]; then
              out=$(python3 -I -B tests/check_public_release.py --tree "$HEAD_SHA" 2>&1)
              status=$?
            else
              echo "::error::unexpected scan mode"
              exit 1
            fi
          fi
          set -e
          printf '%s\n' "$out"
          test "$status" -eq 0
          printf '%s\n' "$out" | grep -qx 'PUBLIC_SCAN_VERIFIED=1'
          echo "verified=true" >> "$GITHUB_OUTPUT"
          if [ "$supports_identity" = "true" ]; then
            printf '%s\n' "$out" | grep -qx 'PUBLIC_SCAN_IDENTITY_VERIFIED=1'
            echo "identity_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity_verified=bootstrap" >> "$GITHUB_OUTPUT"
          fi

  scan-macos:
    name: public scan (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      scan_verified: ${{ steps.run_scan.outputs.verified }}
      identity_verified: ${{ steps.run_scan.outputs.identity_verified }}
    steps:
      - name: Check out the trusted base commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch commit range to scan as git data
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            checked_out=$(git rev-parse HEAD)
            if [ "$checked_out" != "$BASE_SHA" ]; then
              echo "::error::checked-out base commit does not match pull request base SHA"
              exit 1
            fi
            git fetch --no-tags "https://github.com/${REPOSITORY}.git" "+refs/heads/${BASE_REF}:refs/scan/base-branch"
            git merge-base --is-ancestor "$BASE_SHA" refs/scan/base-branch
            git fetch --no-tags "https://github.com/${REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/scan/head"
            fetched=$(git rev-parse refs/scan/head)
            if [ "$fetched" != "$HEAD_SHA" ]; then
              echo "::error::pull request head moved since this event; a newer run will scan it"
              exit 1
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            echo "mode=range" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              checked_out=$(git rev-parse HEAD)
              if [ "$checked_out" != "$PUSH_BEFORE" ]; then
                echo "::error::checked-out base commit does not match previous main commit"
                exit 1
              fi
              if ! git cat-file -e "${PUSH_HEAD}^{commit}" 2>/dev/null; then
                git fetch --no-tags "https://github.com/${REPOSITORY}.git" "$PUSH_HEAD"
              fi
              git cat-file -e "${PUSH_HEAD}^{commit}"
              echo "mode=range" >> "$GITHUB_OUTPUT"
              echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
              echo "head=$PUSH_HEAD" >> "$GITHUB_OUTPUT"
            else
              parents=$(git rev-list --parents -n 1 "$PUSH_HEAD")
              if [ "$(printf '%s\n' "$parents" | wc -w)" -gt 1 ]; then
                echo "::error::push event has zero before SHA on a non-root commit; refusing to trust head scanner"
                exit 1
              fi
              echo "mode=tree" >> "$GITHUB_OUTPUT"
              echo "head=$PUSH_HEAD" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run deterministic privacy and identity scan on every commit
        id: run_scan
        env:
          SCAN_MODE: ${{ steps.target.outputs.mode }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          supports_identity=false
          if python3 -I -B tests/check_public_release.py --help 2>&1 | grep -q -- '--identity-source'; then
            supports_identity=true
          fi
          set +e
          if [ "$supports_identity" = "true" ]; then
            if [ "$SCAN_MODE" = "range" ]; then
              out=$(python3 -I -B tests/check_public_release.py --range "$BASE_SHA" "$HEAD_SHA" --identity-source ci 2>&1)
              status=$?
            elif [ "$SCAN_MODE" = "tree" ]; then
              out=$(python3 -I -B tests/check_public_release.py --tree "$HEAD_SHA" --identity-source ci 2>&1)
              status=$?
            else
              echo "::error::unexpected scan mode"
              exit 1
            fi
          else
            echo "::notice::One-time bootstrap: trusted base scanner predates --identity-source; running base privacy scan without identity verification"
            if [ "$SCAN_MODE" = "range" ]; then
              out=$(python3 -I -B tests/check_public_release.py --range "$BASE_SHA" "$HEAD_SHA" 2>&1)
              status=$?
            elif [ "$SCAN_MODE" = "tree" ]; then
              out=$(python3 -I -B tests/check_public_release.py --tree "$HEAD_SHA" 2>&1)
              status=$?
            else
              echo "::error::unexpected scan mode"
              exit 1
            fi
          fi
          set -e
          printf '%s\n' "$out"
          test "$status" -eq 0
          printf '%s\n' "$out" | grep -qx 'PUBLIC_SCAN_VERIFIED=1'
          echo "verified=true" >> "$GITHUB_OUTPUT"
          if [ "$supports_identity" = "true" ]; then
            printf '%s\n' "$out" | grep -qx 'PUBLIC_SCAN_IDENTITY_VERIFIED=1'
            echo "identity_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity_verified=bootstrap" >> "$GITHUB_OUTPUT"
          fi

  result:
    name: public-scan / result
    needs: [scan-linux, scan-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require verified deterministic privacy and identity scan on Linux and macOS
        env:
          LINUX_RESULT: ${{ needs.scan-linux.result }}
          LINUX_VERIFIED: ${{ needs.scan-linux.outputs.scan_verified }}
          LINUX_IDENTITY_VERIFIED: ${{ needs.scan-linux.outputs.identity_verified }}
          MACOS_RESULT: ${{ needs.scan-macos.result }}
          MACOS_VERIFIED: ${{ needs.scan-macos.outputs.scan_verified }}
          MACOS_IDENTITY_VERIFIED: ${{ needs.scan-macos.outputs.identity_verified }}
        run: |
          set -euo pipefail
          if [ "$LINUX_RESULT" != "success" ] || [ "$LINUX_VERIFIED" != "true" ]; then
            echo "::error::Linux public scan did not complete with verification (result=$LINUX_RESULT verified=$LINUX_VERIFIED identity=$LINUX_IDENTITY_VERIFIED)"
            exit 1
          fi
          if [ "$MACOS_RESULT" != "success" ] || [ "$MACOS_VERIFIED" != "true" ]; then
            echo "::error::macOS public scan did not complete with verification (result=$MACOS_RESULT verified=$MACOS_VERIFIED identity=$MACOS_IDENTITY_VERIFIED)"
            exit 1
          fi
          if [ "$LINUX_IDENTITY_VERIFIED" = "true" ] && [ "$MACOS_IDENTITY_VERIFIED" = "true" ]; then
            echo "Deterministic public and identity scan verified on Linux and macOS."
          elif [ "$LINUX_IDENTITY_VERIFIED" = "bootstrap" ] && [ "$MACOS_IDENTITY_VERIFIED" = "bootstrap" ]; then
            echo "::notice::One-time bootstrap verified on Linux and macOS against a base scanner predating --identity-source."
          else
            echo "::error::Identity scan verification failed or mismatched (linux=$LINUX_IDENTITY_VERIFIED macos=$MACOS_IDENTITY_VERIFIED)"
            exit 1
          fi
