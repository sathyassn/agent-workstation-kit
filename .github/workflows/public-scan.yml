# public-scan: the keyed public-safety scan, the only job that sees
# PUBLIC_SCAN_HMAC_KEY.
#
# The key is an environment secret of the `public-scan` environment, whose
# deployment branches are limited to the default branch, so no workflow on any
# other branch can read it. This job is the only one that names the
# environment.
#
# It runs on `pull_request_target`, so GitHub runs this file from the default
# branch, never from the pull request: a pull request that edits or deletes
# this workflow cannot change the job that judges it. It runs only for pull
# requests into the default branch, and checks out the default branch's commit
# (`github.sha` for this event), never the pull request's base, which could be
# another branch. That commit's scanner, rules and exceptions judge the head. It fetches the pull request head only as git data and scans the
# head commit's tree from git objects (`--tree`); it never checks out, builds
# or runs head code. The secret is passed to the scan step alone, so fork pull
# requests get the same keyed scan safely, and a same-repository branch's code
# never sees the key. A push to main scans the pushed commit with that commit's
# own scanner, which review already accepted. There is no manual trigger.
#
# The required check is the "result" job: "public-scan / result". It always
# runs, so it is never skipped (GitHub counts a skipped required job as a
# pass), and it fails unless the keyed scan succeeded for a pull request into
# the default branch or a push to it. Every pull request event, including
# `edited`, reruns the whole workflow, so retargeting a pull request to the
# default branch replaces any earlier result for that head with a real scan.
name: public-scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  keyed-scan:
    name: keyed scan
    # Only for the default branch: a pull request into it, or a push to it.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment: public-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The trusted side: the default branch's commit for both events. The
      # scanner, rules and exceptions come from here.
      - name: Check out the trusted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the commit to scan as git data
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            git fetch --no-tags --depth=1 "https://github.com/${REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/scan/head"
            fetched=$(git rev-parse refs/scan/head)
            if [ "$fetched" != "$HEAD_SHA" ]; then
              echo "::error::pull request head moved since this event; a newer run will scan it"
              exit 1
            fi
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the keyed scan on the tree
        env:
          PUBLIC_SCAN_HMAC_KEY: ${{ secrets.PUBLIC_SCAN_HMAC_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: python3 -I -B tests/check_public_release.py --tree "$TARGET_SHA"

  result:
    name: result
    needs: keyed-scan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the keyed scan for the default branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KEYED_RESULT: ${{ needs.keyed-scan.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "Not a pull request into $DEFAULT_BRANCH; the keyed scan runs when it targets $DEFAULT_BRANCH."
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::unexpected push ref"
            exit 1
          fi
          if [ "$KEYED_RESULT" != "success" ]; then
            echo "::error::the keyed scan did not succeed (result: $KEYED_RESULT)"
            exit 1
          fi
          echo "Keyed scan passed."
