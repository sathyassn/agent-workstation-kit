# CI runs pull-request head code (Makefile, unit tests, and self-checks).
# Privacy and public-safety steps in this workflow are non-authoritative
# self-tests only and MUST NOT be used as the required privacy gate: the
# authoritative base-revision privacy verdict comes solely from
# `.github/workflows/public-scan.yml` (`public-scan / result`).
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install shell analysis
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run independent repository gate
        env:
          # The pull request's base, so the changelog check sees the whole change.
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-check

      - name: Run public-release gate
        run: make public-check

      - name: Validate Git discipline policy
        run: python3 scripts/check_git_discipline.py policy

      - name: Enforce pull-request Git discipline
        if: github.event_name == 'pull_request'
        env:
          GIT_DISCIPLINE_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_DISCIPLINE_HEAD: ${{ github.event.pull_request.head.sha }}
          GIT_DISCIPLINE_BRANCH: ${{ github.head_ref }}
          GIT_DISCIPLINE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GIT_DISCIPLINE_BASE_REPOSITORY: ${{ github.repository }}
          GIT_DISCIPLINE_ACTOR: ${{ github.actor }}
          GIT_DISCIPLINE_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/check_git_discipline.py ci \
            --base "$GIT_DISCIPLINE_BASE" \
            --head "$GIT_DISCIPLINE_HEAD" \
            --branch "$GIT_DISCIPLINE_BRANCH" \
            --head-repository "$GIT_DISCIPLINE_HEAD_REPOSITORY" \
            --base-repository "$GIT_DISCIPLINE_BASE_REPOSITORY" \
            --actor "$GIT_DISCIPLINE_ACTOR" \
            --pr-body-env GIT_DISCIPLINE_PR_BODY

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pinned Gitleaks
        run: |
          version="8.30.0"
          expected="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          python3 -c 'from pathlib import Path; Path("negative-fixture.txt").write_text("token=" + "glpat-" + "kSaPeOD_-T0JxMi3p28B" + "\n")'
          set +e
          ./gitleaks dir --redact --no-banner --exit-code 7 negative-fixture.txt
          fixture_exit=$?
          set -e
          rm -f negative-fixture.txt
          test "$fixture_exit" -eq 7
          ./gitleaks git --redact --no-banner --exit-code 1 .

  macos-host-lock:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify macOS root host apply lock contention
        run: sudo /usr/bin/python3 -I -B tests/verify_macos_host_lock.py

  macos-public-scan:
    # Non-authoritative head-code self-test on macOS; authoritative privacy
    # verdict is `public-scan / result` in `.github/workflows/public-scan.yml`.
    name: macos-public-scan (non-authoritative head self-test)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run deterministic public-release scan on macOS (non-authoritative)
        run: python3 -I -B tests/check_public_release.py

      - name: Run public-scan unit and hardening tests on macOS
        run: |
          set -euo pipefail
          set +e
          out=$(python3 -B -m unittest discover -s tests -p 'test_public_*.py' -v 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          test "$status" -eq 0
          printf '%s\n' "$out" | grep -Eq '^Ran [1-9][0-9]* tests? in '
