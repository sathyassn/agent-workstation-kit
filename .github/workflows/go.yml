name: Go CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Pull requests may restore the default branch's module and build cache;
          # go mod verify checks module zips against go.sum.
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Check gofmt
        run: |
          out="$(gofmt -l .)" || exit 1
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Check gofmt and goimports
        run: |
          out="$(go tool golangci-lint fmt --diff)" || exit 1
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go tool golangci-lint run ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run govulncheck
        run: go tool govulncheck ./...

      - name: Build release targets (make go-check)
        run: make go-check

      - name: Verify workflow action pins
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tests/verify_action_pins.py
