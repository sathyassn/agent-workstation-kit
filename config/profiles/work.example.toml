# Copy to a private fleet repository or an ignored *.local.toml file.
# Replace every "ask", validate, review, then set state to "approved".
# Desired state only: never add passwords, tokens, keys, or recovery codes.
schema_version = 2
profile = "work"
state = "draft"

[deployment]
namespace = "ac"
context = "work"
ownership = "organization"

[machine]
hostname = "ac-ws-001"
uuid = "11111111-1111-4111-8111-111111111111" # Generate once with fleetctl init.
asset_tag = "ask"
platform = "linux"
os_family = "ubuntu"
hardware_profile = "minisforum-ms-s1-max-64gb"
role = "agent-workstation"

[accounts]
agent = "agent-01"
humans = ["alice", "bob"] # Stable organization/IdP handles; resolve collisions centrally.
admins = ["admin-01", "admin-02"]
admin_assignments = { "admin-01" = "alice", "admin-02" = "bob" }
services = []
operators = ["alice", "bob"]
viewers = []
ssh_users = ["alice", "bob", "admin-01", "admin-02"]

[remote]
tailscale_tailnet = "ask"
tailscale_tags = ["tag:ac-workstation"]
nomachine_port = 4000
kvm = "deferred"
preferred_kvm = "glinet-comet-x-gl-rm4pe"
fallback_kvm = "glinet-comet-poe-gl-rm1pe"
desktop_lock_mode = "ask"

[tooling]
install_agents = true
gws = "ask" # install or skip
secrets_provider = "ask" # 1password, bitwarden, both, or organization-vault
antidote_ref = "ask" # Prefer a reviewed full commit SHA.

[source_control]
gitlab_host = "gitlab.com"
gitlab_identity = "service-account"
github_host = "github.com"
github_identity = "app"

[model_auth]
codex = "api-workload"
claude = "api-workload"
grok = "api-workload"

[security]
disk_encryption_required = true
secure_boot_required = true
remote_scope = "tailscale-only"
endpoint_management = "ask"

[resources]
policy = "measured-balanced"
os_memory_reserve_gib = 8
os_cpu_reserve_threads = 2

[backup]
target = "ask"
retention_days = 30

[maintenance]
timezone = "America/Toronto"
update_window = "ask"
owner = "ask"
