# Organization-owned Apple-platform workstation example.
schema_version = 3
profile = "work"
state = "draft"

[deployment]
namespace = "ac"
context = "work"
ownership = "organization"

[machine]
hostname = "ac-mac-001"
display_name = "Orchard"
uuid = "33333333-3333-4333-8333-333333333333"
asset_tag = "ask"
platform = "macos"
os_family = "macos"
hardware_profile = "mac-mini-or-studio"
role = "agent-workstation"

[accounts]
agent = "agent-01"
humans = ["alice", "bob"]
admins = ["admin-01", "admin-02"]
admin_assignments = { "admin-01" = "alice", "admin-02" = "bob" }
services = []
operators = ["alice", "bob"]
viewers = []
ssh_users = ["alice", "bob", "admin-01", "admin-02"]

[remote]
tailscale_tailnet = "ask"
tailscale_tags = ["tag:ac-workstation"]
nomachine_port = 4000
kvm = "deferred"
preferred_kvm = "glinet-comet-x-gl-rm4pe"
fallback_kvm = "glinet-comet-poe-gl-rm1pe"
desktop_lock_mode = "ask"

[tooling]
install_agents = true
gws = "ask"
secrets_provider = "ask"
antidote_ref = "ask"

[source_control]
gitlab_host = "gitlab.com"
gitlab_identity = "service-account"
gitlab_principal = "ac-agent-dev"
github_host = "github.com"
github_identity = "app"
github_principal = "ac-agent-dev"

[collaboration]
atlassian_site = "ask"
atlassian_identity = "ask"
atlassian_principal = "ask" # Prefer acagentdev when enabled; Atlassian allows 6-30 alphanumeric characters.
atlassian_mcp_auth = "ask"

[model_auth]
codex = "api-workload"
claude = "api-workload"
grok = "api-workload"

[security]
disk_encryption_required = true
secure_boot_required = true
remote_scope = "tailscale-only"
endpoint_management = "ask"

[resources]
policy = "measured-balanced"
os_memory_reserve_gib = 8
os_cpu_reserve_threads = 2

[backup]
target = "ask"
retention_days = 30

[maintenance]
timezone = "America/Toronto"
update_window = "ask"
owner = "ask"
