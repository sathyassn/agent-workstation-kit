min_version = "2026.8.0"

[settings]
lockfile = true
minimum_release_age = "7d"

[tools]
node = "lts"
python = "3.13"
bun = "latest"
pnpm = "latest"
gh = "latest"
glab = "latest"
# Reviewed stable release. Herdr entered the mise registry after older mise
# releases; an unknown key is a user-tooling error and must be resolved by
# updating mise through the documented install path.
herdr = "0.8.2"

# Provider-supported npm distributions. Grok Build uses xAI's separate
# reviewed installer and is intentionally not represented as an npm package.
"npm:@openai/codex" = "latest"
"npm:@anthropic-ai/claude-code" = "latest"

# Optional tools such as gws are added only after profile approval.
