# Tool and dependency registry (ADR 0005 section 2b and section 13).
# Every direct require and every tool directive in go.mod is recorded here with
# its exact version, its go.sum h1 sum, canonical source, SPDX licence
# identifier and review dates. Indirect modules are not listed: go.sum
# integrity and govulncheck hold that graph. internal/registry checks this.
# Managed workstation CLIs join this registry in EPC-011 / T6.
# - The `go` line in go.mod is a security pin: CI's setup-go reads it, so it
#   decides the toolchain CI runs. Raise it when govulncheck reports a
#   reachable standard-library fix in a newer patch release, in the PR that
#   makes the path reachable or in its own build PR when found on main.

schema_version = 1

