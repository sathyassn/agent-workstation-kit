# Tool and dependency registry (ADR 0005 section 2b and section 13).
# Every Go library and build tool pinned in go.mod is recorded here with its
# exact version, canonical source, SPDX licence identifier and review dates.
# Managed workstation CLIs join this registry in EPC-011 / T6.

schema_version = 1

[[tool]]
id = "toml"
kind = "go-library"
module = "github.com/BurntSushi/toml"
version = "v1.6.0"
source = "https://github.com/BurntSushi/toml"
licence = "MIT"
last_review = "2026-11-22"
next_review = "2027-05-22"
purpose = "TOML v1.0 parser and encoder for schemas, registries and machine profiles"

[[tool]]
id = "jcs"
kind = "go-library"
module = "github.com/gowebpki/jcs"
version = "v1.0.2"
source = "https://github.com/gowebpki/jcs"
licence = "Apache-2.0"
last_review = "2026-11-22"
next_review = "2027-05-22"
purpose = "RFC 8785 canonical JSON serialisation for plan digests"

