# The unit catalog: the one source for every unit's stage, privilege, OS,
# dependencies, epic and milestone (ADR 0005 sections 2a and 15).
# Tables in docs/plan/roadmap.md, SPC-001 and ADR 0005 are generated from this
# file by tests/catalog_tables.py; `make check` fails when they are stale.
# TSK-005 replaces the generator with `go generate`.
#
# Fields:
#   stage      scope ID per OS ("-" when the unit does not run on that OS)
#   privilege  root | package-owner | agent | user, per OS
#   depends    unit IDs per OS; "packages" is satisfied on macOS by
#              packages-user and packages together
#   epic       the epic that builds the unit; milestone: the release phase

schema_version = 1

[[unit]]
id = "baseline"
domain = "system"
stage = { linux = "baseline", macos = "baseline" }
privilege = { linux = "root", macos = "root" }
depends = { linux = [], macos = [] }
epic = "EPC-005"
milestone = "alpha"

[[unit]]
id = "packages-user"
domain = "system"
stage = { linux = "-", macos = "packages-user" }
privilege = { linux = "-", macos = "package-owner" }
depends = { linux = [], macos = ["baseline"] }
epic = "EPC-013"
milestone = "alpha"

[[unit]]
id = "packages"
domain = "system"
stage = { linux = "packages", macos = "packages" }
privilege = { linux = "root", macos = "root" }
depends = { linux = ["baseline"], macos = ["packages-user"] }
epic = "EPC-013"
milestone = "alpha"

